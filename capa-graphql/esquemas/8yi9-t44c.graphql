# ---------- 8yi9-t44c ----------

"""Tráfico vehicular mensual en los peajes de la ANI por categoría de tarifa. Cada fila cubre el periodo entre desde y hasta. (8yi9-t44c)"""
type TraficoPeajes {
  idPeaje: Int
  peaje: String
  categoriaTarifa: String
  desde: Date
  hasta: Date
  valorTarifa: Int
  cantidadTrafico: Int
  cantidadEvasores: Int
  cantidadExentos787: Int
}

input TraficoPeajesWhere {
  _and: [TraficoPeajesWhere!]
  _or: [TraficoPeajesWhere!]
  _not: TraficoPeajesWhere
  idPeaje: IntFilter
  peaje: StringFilter
  categoriaTarifa: StringFilter
  desde: DateFilter
  desdeYear: IntFilter
  desdeMonth: IntFilter
  hasta: DateFilter
  hastaYear: IntFilter
  hastaMonth: IntFilter
  valorTarifa: IntFilter
  cantidadTrafico: IntFilter
  cantidadEvasores: IntFilter
  cantidadExentos787: IntFilter
}

input TraficoPeajesOrderBy {
  idPeaje: OrderDirection
  peaje: OrderDirection
  categoriaTarifa: OrderDirection
  desde: OrderDirection
  hasta: OrderDirection
  valorTarifa: OrderDirection
  cantidadTrafico: OrderDirection
  cantidadEvasores: OrderDirection
  cantidadExentos787: OrderDirection
}

type TraficoPeajesSum {
  valorTarifa: Float
  cantidadTrafico: Float
  cantidadEvasores: Float
  cantidadExentos787: Float
}

input TraficoPeajesSumOrderBy {
  valorTarifa: OrderDirection
  cantidadTrafico: OrderDirection
  cantidadEvasores: OrderDirection
  cantidadExentos787: OrderDirection
}

type TraficoPeajesMinMax {
