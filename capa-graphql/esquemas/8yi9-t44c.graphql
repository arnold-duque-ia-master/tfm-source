  desde: Int
  hasta: Int
}

input TraficoPeajesCountDistinctOrderBy {
  idPeaje: OrderDirection
  peaje: OrderDirection
  categoriaTarifa: OrderDirection
  desde: OrderDirection
  hasta: OrderDirection
}

"""Fila de un resultado agregado de traficoPeajes. Los campos escalares seleccionados son las claves de agrupación."""
type TraficoPeajesGroup {
  idPeaje: Int
  peaje: String
  categoriaTarifa: String
  desde: Date
  "Año de desde."
  desdeYear: Int
  "Mes (1-12) de desde."
  desdeMonth: Int
  hasta: Date
  "Año de hasta."
  hastaYear: Int
  "Mes (1-12) de hasta."
  hastaMonth: Int
  "Número de filas del grupo."
  count: Int!
  countDistinct: TraficoPeajesCountDistinct
  sum: TraficoPeajesSum
  avg: TraficoPeajesSum
  min: TraficoPeajesMinMax
  max: TraficoPeajesMinMax
}

input TraficoPeajesGroupOrderBy {
  idPeaje: OrderDirection
  peaje: OrderDirection
  categoriaTarifa: OrderDirection
  desde: OrderDirection
  desdeYear: OrderDirection
  desdeMonth: OrderDirection
  hasta: OrderDirection
  hastaYear: OrderDirection
  hastaMonth: OrderDirection
  count: OrderDirection
  countDistinct: TraficoPeajesCountDistinctOrderBy
  sum: TraficoPeajesSumOrderBy
  avg: TraficoPeajesSumOrderBy
  min: TraficoPeajesMinMaxOrderBy
  max: TraficoPeajesMinMaxOrderBy
}

extend type Query {
  "Filas de 8yi9-t44c. Sin orderBy se ordenan por el identificador interno de fila."
  traficoPeajes(where: TraficoPeajesWhere, orderBy: [TraficoPeajesOrderBy!], limit: Int = 100, offset: Int = 0): [TraficoPeajes!]!
  "Agregados de 8yi9-t44c agrupados por los campos escalares seleccionados."
  traficoPeajesAggregate(where: TraficoPeajesWhere, orderBy: [TraficoPeajesGroupOrderBy!], limit: Int = 100, offset: Int = 0): [TraficoPeajesGroup!]!
}
