"""Índice de Gobierno Digital por entidad pública, vigencia e índice, con el puntaje de la entidad y las estadísticas de su grupo par. (rtai-k9uh)"""
type IndiceGobiernoDigital {
  "Código único de identificación de las entidades, de acuerdo con el Sistema de Información y Gestión del…"
  codigoSigep: Int
  "Razón social de las entidades públicas"
  entidad: String
  "Orden en que se encuentre clasificada cada entidad: nacional o territorial"
  orden: IndiceGobiernoDigitalOrden
  "Corresponde a los 24 sectores administrativos de la rama ejecutiva del orden nacional"
  sector: IndiceGobiernoDigitalSector
  "Naturaleza jurídica de cada entidad"
  naturalezaJuridica: String
  "Código único de identificación DIVIPOLA de los departamentos de Colombia"
  idDepartamento: Int
  "Departamentos de Colombia"
  departamento: String
  "Código único de identificación DIVIPOLA de los municipios de Colombia"
  idMunicipio: Int
  "Municipios de Colombia"
  municipio: String
  "Año de medición"
  vigencia: Int
  "Código único de identificación de cada índice"
  idIndice: String
  "Nombre de cada índice"
  indice: IndiceGobiernoDigitalIndice
  "Puntaje obtenido por cada entidad en cada índice y en cada vigencia"
  puntajeEntidad: Float
  "Puntaje promedio del grupo par al que pertenece cada entidad"
  promedioGrupoPar: Float
  "Puntaje máximo del grupo par al que pertenece cada entidad"
  maximoGrupoPar: Float
  "Puntaje mínimo del grupo par al que pertenece cada entidad"
  minimoGrupoPar: Float
  "Quintil en el que se ubica cada entidad dentro de su grupo par"
  quintilGrupoPar: Int
  "Percentil en el que se ubica cada entidad dentro de su grupo par"
  percentilGrupoPar: Int
}

input IndiceGobiernoDigitalWhere {
  _and: [IndiceGobiernoDigitalWhere!]
  _or: [IndiceGobiernoDigitalWhere!]
  _not: IndiceGobiernoDigitalWhere
  codigoSigep: IntFilter
  entidad: StringFilter
  orden: IndiceGobiernoDigitalOrdenFilter
  sector: IndiceGobiernoDigitalSectorFilter
  naturalezaJuridica: StringFilter
  idDepartamento: IntFilter
  departamento: StringFilter
  idMunicipio: IntFilter
  municipio: StringFilter
  vigencia: IntFilter
  idIndice: StringFilter
  indice: IndiceGobiernoDigitalIndiceFilter
  puntajeEntidad: FloatFilter
  promedioGrupoPar: FloatFilter
  maximoGrupoPar: FloatFilter
  minimoGrupoPar: FloatFilter
  quintilGrupoPar: IntFilter
  percentilGrupoPar: IntFilter
}

