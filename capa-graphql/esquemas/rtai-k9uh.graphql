"""Fila de un resultado agregado de indiceGobiernoDigital. Los campos escalares seleccionados son las claves de agrupación."""
type IndiceGobiernoDigitalGroup {
  codigoSigep: Int
  entidad: String
  orden: IndiceGobiernoDigitalOrden
  sector: IndiceGobiernoDigitalSector
  naturalezaJuridica: String
  idDepartamento: Int
  departamento: String
  idMunicipio: Int
  municipio: String
  vigencia: Int
  idIndice: String
  indice: IndiceGobiernoDigitalIndice
  "Número de filas del grupo."
  count: Int!
  countDistinct: IndiceGobiernoDigitalCountDistinct
  sum: IndiceGobiernoDigitalSum
  avg: IndiceGobiernoDigitalSum
  min: IndiceGobiernoDigitalMinMax
  max: IndiceGobiernoDigitalMinMax
}

input IndiceGobiernoDigitalGroupOrderBy {
  codigoSigep: OrderDirection
  entidad: OrderDirection
  orden: OrderDirection
  sector: OrderDirection
  naturalezaJuridica: OrderDirection
  idDepartamento: OrderDirection
  departamento: OrderDirection
  idMunicipio: OrderDirection
  municipio: OrderDirection
  vigencia: OrderDirection
  idIndice: OrderDirection
  indice: OrderDirection
  count: OrderDirection
  countDistinct: IndiceGobiernoDigitalCountDistinctOrderBy
  sum: IndiceGobiernoDigitalSumOrderBy
  avg: IndiceGobiernoDigitalSumOrderBy
  min: IndiceGobiernoDigitalMinMaxOrderBy
  max: IndiceGobiernoDigitalMinMaxOrderBy
}

extend type Query {
  "Filas de rtai-k9uh. Sin orderBy se ordenan por el identificador interno de fila."
  indiceGobiernoDigital(where: IndiceGobiernoDigitalWhere, orderBy: [IndiceGobiernoDigitalOrderBy!], limit: Int = 100, offset: Int = 0): [IndiceGobiernoDigital!]!
  "Agregados de rtai-k9uh agrupados por los campos escalares seleccionados."
  indiceGobiernoDigitalAggregate(where: IndiceGobiernoDigitalWhere, orderBy: [IndiceGobiernoDigitalGroupOrderBy!], limit: Int = 100, offset: Int = 0): [IndiceGobiernoDigitalGroup!]!
}
