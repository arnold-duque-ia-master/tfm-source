  vigencia: OrderDirection
  idIndice: OrderDirection
  indice: OrderDirection
  puntajeEntidad: OrderDirection
  promedioGrupoPar: OrderDirection
  maximoGrupoPar: OrderDirection
  minimoGrupoPar: OrderDirection
  quintilGrupoPar: OrderDirection
  percentilGrupoPar: OrderDirection
}

