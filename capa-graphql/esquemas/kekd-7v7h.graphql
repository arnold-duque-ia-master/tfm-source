  excedenciasLimiteActual: IntFilter
  porcentajeExcedenciasLimiteActual: FloatFilter
  mediana: FloatFilter
  percentil98: FloatFilter
  maximo: FloatFilter
  minimo: FloatFilter
  diasDeExcedencias: IntFilter
  codigoDelDepartamento: IntFilter
  nombreDelDepartamento: CalidadAireNombreDelDepartamentoFilter
  codigoDelMunicipio: StringFilter
  nombreDelMunicipio: StringFilter
  tipoDeEstacion: CalidadAireTipoDeEstacionFilter
