"""Calidad del aire en Colombia (promedio anual). Una fila por estación, variable, tiempo de exposición y año. (kekd-7v7h)"""
type CalidadAire {
  "Identificador único asignado por el Subsistema de Información sobre Calidad del Aire - SISAIRE a cada…"
  idEstacion: Int
  "Autoridad Ambiental encargada de operar el Sistema de Vigilancia de la Calidad del Aire en la jurisdicción…"
  autoridadAmbiental: CalidadAireAutoridadAmbiental
  "Nombre específico que se designa a la estación de monitoreo de calidad del aire."
  estacion: String
  "Coordenada geográfica que indica la latitud de la ubicación de la estación (Sistema de referencia espacial…"
  latitud: Float
  "Coordenada geográfica que indica la longitud de la ubicación de la estación (Sistema de referencia espacial…"
  longitud: Float
  "Contaminante atmosférico o variable meteorológica que se mide en la estación de monitoreo de la calidad del…"
  variable: CalidadAireVariable
  "Unidad de medida empleada para expresar el contaminante atmosférico o variable meteorológica"
  unidades: CalidadAireUnidades
  "Período de referencia específico establecido normativamente (Resolución 2254/2017) para evaluar los niveles…"
  tiempoDeExposicionHoras: Int
  "Año en el que se realizó la medición en la respectiva estación."
  anio: Int
  "Promedio anual del nivel de inmisión o concentración a condiciones de referencia o estándar (std) del…"
  promedio: Float
  "Total acumulado anual del nivel de inmisión o concentración a condiciones de referencia o estándar (std) del…"
  suma: Float
  "Cantidad total de datos validos recopilados durante el año de medición."
  noDeDatos: Int
  "Porcentaje del tiempo total de un período tiene datos válidos registrados"
  representatividadTemporal: Float
  "Número total de veces en que el contaminante atmosférico ha superado el nivel máximo permisible vigente…"
  excedenciasLimiteActual: Int
  "Proporción determinada por el número de veces en que el contaminante atmosférico ha superado el nivel máximo…"
  porcentajeExcedenciasLimiteActual: Float
  "Mediana anual del nivel de inmisión o concentración a condiciones de referencia o estándar (std) del…"
  mediana: Float
  "Medida estadística que indica el valor del contaminante atmosférico o de la variable meteorológica por debajo…"
  percentil98: Float
  "Valor más alto registrado del contaminante atmosférico o de la variable meteorológica durante el año de…"
  maximo: Float
  "Valor más bajo registrado del contaminante atmosférico o de la variable meteorológica durante el año de…"
  minimo: Float
  "Número total de días en que el contaminante atmosférico ha superado el nivel máximo permisible vigente…"
  diasDeExcedencias: Int
  "Código DANE asignado al departamento."
  codigoDelDepartamento: Int
  "Nombre del departamento"
  nombreDelDepartamento: CalidadAireNombreDelDepartamento
  "Código del municipio"
  codigoDelMunicipio: String
  "Nombre del municipio"
  nombreDelMunicipio: String
  "Ubicación de la estación (Sistema de referencia espacial MAGNA- SIRGAS)"
  tipoDeEstacion: CalidadAireTipoDeEstacion
}

input CalidadAireWhere {
  _and: [CalidadAireWhere!]
  _or: [CalidadAireWhere!]
  _not: CalidadAireWhere
  idEstacion: IntFilter
  autoridadAmbiental: CalidadAireAutoridadAmbientalFilter
  estacion: StringFilter
  latitud: FloatFilter
  longitud: FloatFilter
  variable: CalidadAireVariableFilter
  unidades: CalidadAireUnidadesFilter
  tiempoDeExposicionHoras: IntFilter
  anio: IntFilter
  promedio: FloatFilter
