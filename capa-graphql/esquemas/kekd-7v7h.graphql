"""Fila de un resultado agregado de calidadAire. Los campos escalares seleccionados son las claves de agrupación."""
type CalidadAireGroup {
  idEstacion: Int
  autoridadAmbiental: CalidadAireAutoridadAmbiental
  estacion: String
  variable: CalidadAireVariable
  unidades: CalidadAireUnidades
  tiempoDeExposicionHoras: Int
  anio: Int
  codigoDelDepartamento: Int
  nombreDelDepartamento: CalidadAireNombreDelDepartamento
  codigoDelMunicipio: String
  nombreDelMunicipio: String
  tipoDeEstacion: CalidadAireTipoDeEstacion
  "Número de filas del grupo."
  count: Int!
  countDistinct: CalidadAireCountDistinct
  sum: CalidadAireSum
  avg: CalidadAireSum
  min: CalidadAireMinMax
  max: CalidadAireMinMax
}

input CalidadAireGroupOrderBy {
  idEstacion: OrderDirection
  autoridadAmbiental: OrderDirection
  estacion: OrderDirection
  variable: OrderDirection
  unidades: OrderDirection
  tiempoDeExposicionHoras: OrderDirection
  anio: OrderDirection
  codigoDelDepartamento: OrderDirection
  nombreDelDepartamento: OrderDirection
  codigoDelMunicipio: OrderDirection
  nombreDelMunicipio: OrderDirection
  tipoDeEstacion: OrderDirection
  count: OrderDirection
  countDistinct: CalidadAireCountDistinctOrderBy
  sum: CalidadAireSumOrderBy
  avg: CalidadAireSumOrderBy
  min: CalidadAireMinMaxOrderBy
  max: CalidadAireMinMaxOrderBy
}

extend type Query {
  "Filas de kekd-7v7h. Sin orderBy se ordenan por el identificador interno de fila."
  calidadAire(where: CalidadAireWhere, orderBy: [CalidadAireOrderBy!], limit: Int = 100, offset: Int = 0): [CalidadAire!]!
  "Agregados de kekd-7v7h agrupados por los campos escalares seleccionados."
  calidadAireAggregate(where: CalidadAireWhere, orderBy: [CalidadAireGroupOrderBy!], limit: Int = 100, offset: Int = 0): [CalidadAireGroup!]!
}
